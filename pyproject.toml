[build-system]
requires = ["hatchling>=1.21"]
build-backend = "hatchling.build"

[project]
name = "anybrain"
version = "0.0.1"
description = "Your second brain in Markdown. Any model, any agent."
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
dependencies = ["pyyaml>=6.0"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
anybrain = "anybrain.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["anybrain"]

# A non-editable install (uv tool install ., pipx install .) has no repo checkout next to the
# package, so the framework files that init and update copy are shipped inside the wheel.
# An editable install reads them from the repo root instead (see anybrain.vault.framework_root).
[tool.hatch.build.targets.wheel.force-include]
"skills" = "anybrain/_framework/skills"
"templates" = "anybrain/_framework/templates"
"evals" = "anybrain/_framework/evals"

[tool.pytest.ini_options]
testpaths = ["tests"]
