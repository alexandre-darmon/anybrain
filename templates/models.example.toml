# Model profiles and routing (PRD section 18.2). Copied to <vault>/.harness/models.toml by `anybrain init`.
# The model of each profile is chosen by `anybrain eval`, not by this file.

[profiles.frontier]
base_url    = "https://openrouter.ai/api/v1"   # or a provider's own endpoint
model       = "<frontier model id>"            # chosen by eval
api_key_env = "FRONTIER_API_KEY"               # the value lives in .harness/.env

[profiles.local]
base_url    = "http://localhost:11434/v1"      # Ollama
model       = "<local model id>"               # chosen by: anybrain eval --profile local
api_key_env = ""

# Folder ("me/") or file ("me/preferences.md") -> profile. A file entry wins over its folder; among
# folders, the longest wins. Everything routed "local" is denied to frontier sessions by the harness
# configs and hidden by anybrain's commands outside the local profile. me/preferences.md and me/voice.md are
# already readable by every model; to open one more file, add a line for it, such as "me/cv.md" = "frontier",
# then run `anybrain update`. company/ and finance/ always stay local: a "frontier" line for them is ignored.
[routing]
default             = "frontier"
"me/"               = "local"
"me/preferences.md" = "frontier"               # rules for the agent; read by every model
"me/voice.md"       = "frontier"               # how the owner writes; read by every model (Q35)
"journal/"          = "local"
"company/"          = "local"
"finance/"          = "local"
"raw/docs/"         = "local"
"journal/reports/"  = "frontier"               # lint reports written by frontier sessions

[skills]
dirs = ["~/.agents/skills", "~/.claude/skills"] # where init and update link the skills

# Headless commands used by `anybrain eval`, checked against the official docs on 2026-11-16 (D020).
# Each case runs in a throwaway copy of the vault, so the eval pre-approves the tools a skill needs
# there; this never applies to your own sessions (D031). anybrain adds the machine-output flags itself.
[harnesses.claude]
headless = "claude -p {prompt} --permission-mode acceptEdits --allowedTools 'Bash(anybrain *)' Read Edit Write Glob Grep Skill"
judge    = "claude -p {prompt} --tools '' --strict-mcp-config"   # the eval judge: no built-in tools, no MCP server
[harnesses.opencode]
headless = "opencode run --standalone {prompt}"   # --standalone passes ANYBRAIN_PROFILE to the run (D020)

[search]
engine = "none"   # "qmd": local search with QMD (PRD 17.2), installed with npm install -g @tobilu/qmd (Node.js 22+).
                  # Then run anybrain update and anybrain search . --refresh. Two indexes stay outside the vault:
                  # frontier sessions search only what the routing above lets them read (D055).

[eval]
judge      = "endpoint:frontier"   # who grades `behaviour`, in a fresh context: endpoint:<profile> or harness:<name>
                                   # a --profile local run needs endpoint:local on localhost
jobs       = 2                     # cases run in parallel; one at a time with --max-cost
timeout_s  = 600                   # per case
max_tokens = 1024                  # judge answer
retries    = 2                     # when the harness gives no answer
quiet_minutes = 15                 # if you edit the vault during a run: wait this long without edits,
relaunches = 2                     # then run again the cases that saw the old content (at most this often)
