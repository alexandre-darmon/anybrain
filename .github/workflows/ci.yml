name: ci

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: pip install -e ".[dev]"
      - name: Tests (includes the repo hygiene checks of PRD section 23)
        run: pytest -q
      - name: CLI is installed
        run: anybrain --help
      - name: Golden indexes and graph.json of vault.example are up to date
        run: anybrain index vault.example --check
      - name: vault.example passes every lint check
        # vault.example is a snapshot dated 2026-11-16; date-based checks use that date (docs/decisions.md D008)
        env:
          ANYBRAIN_TODAY: "2026-11-16"
        run: anybrain lint vault.example

  init-on-macos:
    # PRD 24 step 13: `init` on a clean macOS user works. A fresh runner and an empty home folder stand in
    # for a new user; the package is installed as an owner would install it, not in editable mode.
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install as an owner would (not editable)
        run: python -m pip install .
      - name: init twice in an iCloud-style path of an empty home, then doctor, index and lint
        run: |
          export HOME="$RUNNER_TEMP/home"
          mkdir -p "$HOME"
          cd "$RUNNER_TEMP"
          VAULT="$HOME/Library/Mobile Documents/iCloud~md~obsidian/Documents/brain"
          anybrain init "$VAULT" --owner "Test Owner" --lang en
          anybrain init "$VAULT" --owner "Test Owner" --lang en | tee second-init.txt
          grep -q "init: 0 change(s)" second-init.txt
          anybrain doctor "$VAULT"
          anybrain index "$VAULT" --check
          anybrain lint "$VAULT"
